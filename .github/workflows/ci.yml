name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.4.1
          poetry install --with dev

      - name: Build package
        run: poetry build --format wheel

      - name: Run full test suite
        run: PYTHONPATH=. poetry run pytest -q

  mcp-compatibility:
    name: MCP ${{ matrix.mcp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcp-version: "1.12.4"
            pydantic: "pydantic==2.10.4"
          - mcp-version: "1.30.0"
            pydantic: "pydantic>=2.12,<3"
          - mcp-version: "2.3.0"
            pydantic: "pydantic>=2.12,<3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and selected MCP SDK
        run: python -m pip install -e . pytest "mcp==${{ matrix.mcp-version }}" "${{ matrix.pydantic }}"
      - name: Test MCP compatibility
        run: PYTHONPATH=. python -m pytest -q tests/test_mcp_client_manager.py
